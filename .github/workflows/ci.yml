name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check launcher scripts
      - name: Ruff format check
        run: ruff format --check launcher scripts

  typecheck:
    name: typecheck (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Mypy
        run: mypy

  audit:
    name: audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install -e ".[ui]"
          python -m pip install pip-audit
      - name: Audit dependencies
        run: pip-audit --progress-spinner off

  test:
    name: test (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        if: ${{ !(matrix.os == 'ubuntu-latest' && matrix.python == '3.13') }}
        run: python -m pytest -q
      - name: Test with coverage (gate)
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.python == '3.13' }}
        run: python -m pytest -q --cov=launcher --cov-report=term-missing --cov-fail-under=60
