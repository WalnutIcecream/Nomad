name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    name: resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import re, pathlib
          text = pathlib.Path("launcher/__init__.py").read_text(encoding="utf-8")
          print("version=" + re.search(r'__version__\s*=\s*"([^"]+)"', text).group(1))
          PY
      - name: Verify the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          version="${{ steps.v.outputs.version }}"
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match launcher.__version__ $version"
            exit 1
          fi

  build:
    name: build (${{ matrix.os }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e ".[ui]" pyinstaller

      - name: Fetch appimagetool
        if: matrix.os == 'ubuntu-latest'
        run: |
          curl -sSL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /usr/local/bin/appimagetool

      - name: Install NSIS
        if: matrix.os == 'windows-latest'
        run: choco install nsis --no-progress -y

      - name: Build bundle
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: python scripts/app/build_app.py

      - name: Package (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          version="${{ needs.version.outputs.version }}"
          cd dist
          tar czf "Nomad-${version}-x86_64.tar.gz" nomad
          sha256sum ./*.AppImage ./*.tar.gz > SHA256SUMS.txt

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $version = "${{ needs.version.outputs.version }}"
          Compress-Archive -Path dist/nomad -DestinationPath "dist/Nomad-$version-win64.zip"
          Get-FileHash dist/*.zip, dist/*.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)" } |
            Out-File dist/SHA256SUMS.txt -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: nomad-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  release:
    name: publish release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Nomad v${{ needs.version.outputs.version }}
          files: dist/**
          generate_release_notes: true
