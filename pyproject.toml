[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nomad"
dynamic = ["version"]
description = "Distributed Minecraft hosting over your own object storage (Cloudflare R2 or a self-hosted S3 server)"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
ui = [
    "PySide6>=6.7",
]
# Store storage credentials in the OS keychain. Optional: without it Nomad
# falls back to a 0600 settings file.
secure = [
    "keyring>=24",
]

[project.scripts]
# One entry point for everything: CLI commands and `nomad gui` for the desktop
# window. `python -m launcher.ui` still works as an alternative.
nomad = "launcher.cli.main:main"

[tool.setuptools.packages.find]
include = ["launcher*"]

[tool.setuptools.dynamic]
version = { attr = "launcher.__version__" }

[tool.pytest.ini_options]
testpaths = ["launcher/tests"]
addopts = "-q"
