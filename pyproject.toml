[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nomad"
dynamic = ["version"]
description = "Distributed Minecraft hosting over your own object storage (Cloudflare R2 or a self-hosted S3 server)"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
    "mypy>=2.4.0",
]
ui = [
    "PySide6>=6.12.0",
]
# Store storage credentials in the OS keychain. Optional: without it Nomad
# falls back to a 0600 settings file.
secure = [
    "keyring>=25.7.0",
]

[project.scripts]
# One entry point for everything: CLI commands and `nomad gui` for the desktop
# window. `python -m launcher.ui` still works as an alternative.
nomad = "launcher.cli.main:main"

[tool.setuptools.packages.find]
include = ["launcher*"]

[tool.setuptools.dynamic]
version = { attr = "launcher.__version__" }

[tool.pytest.ini_options]
testpaths = ["launcher/tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Line width is the formatter's job; long string/URL literals are allowed.
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
files = ["launcher"]
# Start lenient and ratchet: the GUI (PySide6) and the tests are out of scope
# for type checking until the core is fully green.
exclude = ["launcher/ui/", "launcher/tests/"]

[[tool.mypy.overrides]]
# The PySide6 GUI is not type-checked yet (stubs not installed); ratchet later.
module = ["launcher.ui.*"]
ignore_errors = true

[tool.coverage.run]
source = ["launcher"]
omit = ["launcher/tests/*", "launcher/ui/*"]

[tool.coverage.report]
show_missing = true
