[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nomad"
version = "0.1.0"
description = "Distributed, cloud-persistent Minecraft hosting"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
ui = [
    "PySide6>=6.7",
]

[project.scripts]
nomad = "launcher.cli.main:main"
nomad-controller = "backend.run:main"
nomad-relay = "relay.server:main"
nomad-hub = "nomad_app.hub:main"

[tool.setuptools.packages.find]
include = ["shared*", "launcher*", "backend*", "nomad_app*", "relay*"]

[tool.pytest.ini_options]
testpaths = ["launcher/tests", "backend/tests"]
addopts = "-q"
