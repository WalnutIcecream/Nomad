[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nomad"
version = "0.2.0"
description = "Distributed Minecraft hosting via Cloudflare R2 object storage"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
ui = [
    "PySide6>=6.7",
]

[project.scripts]
nomad = "launcher.cli.main:main"
nomad-gui = "launcher.ui.__main__:main"

[tool.setuptools.packages.find]
include = ["launcher*"]

[tool.pytest.ini_options]
testpaths = ["launcher/tests"]
addopts = "-q"
